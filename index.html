<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRM30 베타 테스트</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    background: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 2rem 1rem;
    box-sizing: border-box;
  }
  h1 {
    font-size: 2rem;
    color: #1d1d1f;
    margin: 0;
    text-align: center;
  }
  form {
    width: 100%;
    max-width: 360px;
    background: #fff;
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  label {
    font-size: 0.875rem;
    font-weight: 600;
    color: #1d1d1f;
  }
  input, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 0.6rem 0.75rem;
    border: 1px solid #d2d2d7;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
  }
  textarea {
    resize: vertical;
    min-height: 80px;
  }
  button {
    margin-top: 0.5rem;
    padding: 0.75rem;
    border: none;
    border-radius: 8px;
    background: #0071e3;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: #a1a1a6;
    cursor: not-allowed;
  }
  #status {
    min-height: 1.25rem;
    font-size: 0.9rem;
    text-align: center;
  }
  #status.success {
    color: #1a7f37;
  }
  #status.error {
    color: #d1242f;
  }
</style>
</head>
<body>
  <h1>FRM30 베타 테스트 페이지입니다</h1>

  <form id="apply-form">
    <div>
      <label for="name">이름</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="email">이메일</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="motivation">신청동기</label>
      <textarea id="motivation" name="motivation" required></textarea>
    </div>
    <button type="submit" id="submit-btn">신청하기</button>
    <p id="status"></p>
  </form>

  <script>
    const SUPABASE_URL = "https://bnaznmsllymfuuabvjfs.supabase.co";
    const SUPABASE_KEY = "sb_publishable_T3iQ0cZ2bl4dDw7rPb2yHg_EaW99POW";

    const form = document.getElementById("apply-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusEl.textContent = "";
      statusEl.className = "";

      const payload = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        motivation: document.getElementById("motivation").value.trim(),
      };

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/frm30_applicants`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Prefer": "return=minimal",
          },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          throw new Error(await res.text());
        }

        statusEl.textContent = "신청이 완료되었습니다";
        statusEl.className = "success";
        form.reset();
      } catch (err) {
        statusEl.textContent = "제출 중 오류가 발생했습니다. 다시 시도해주세요.";
        statusEl.className = "error";
        console.error(err);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
